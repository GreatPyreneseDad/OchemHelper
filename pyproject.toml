[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ochem-helper"
version = "0.2.0"
description = "RDKit-based functional-group, drug-likeness and retrosynthesis helper for organic chemistry"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Christopher MacGregor"},
]
keywords = ["chemistry", "organic-chemistry", "rdkit", "functional-groups", "teaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "rdkit>=2023.3.1",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
# The SMILES VAE / GNN code is present but UNTRAINED. Install these only if you
# intend to train it (scripts/train_vae.py); nothing in the CLI needs them.
generative = ["torch>=2.0.0", "pandas>=2.0.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "pydantic>=2.0.0", "pandas>=2.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
gpu = ["cuda-toolkit"]
viz = ["pymol", "nglview", "py3Dmol>=2.0.0"]

[project.scripts]
ochem = "src.cli:main"

[project.urls]
Homepage = "https://github.com/GreatPyreneseDad/OchemHelper"
Repository = "https://github.com/GreatPyreneseDad/OchemHelper"
Issues = "https://github.com/GreatPyreneseDad/OchemHelper/issues"

[project.scripts]
ochem-train = "scripts.train_model:main"
ochem-generate = "scripts.generate_molecules:main"
ochem-api = "api.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false