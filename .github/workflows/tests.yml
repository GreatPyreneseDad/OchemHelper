name: tests

on:
  push:
  pull_request:

jobs:
  rdkit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (RDKit only — no torch)
        run: |
          python -m pip install --upgrade pip
          pip install rdkit numpy scikit-learn joblib pytest
      - name: Functional groups + CLI
        run: pytest -q tests/unit/test_functional_groups.py tests/unit/test_cli.py
